name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [frontend, backend/Inventory.Api, backend/FoodCost.Api, backend/Production.Api]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        if: matrix.project == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install frontend dependencies
        if: matrix.project == 'frontend'
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        if: matrix.project == 'frontend'
        run: |
          cd frontend
          npm run build
      - name: Setup .NET
        if: matrix.project != 'frontend'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Restore .NET dependencies
        if: matrix.project != 'frontend'
        run: |
          cd "${{ matrix.project }}"
          dotnet restore
      - name: Build .NET project
        if: matrix.project != 'frontend'
        run: |
          cd "${{ matrix.project }}"
          dotnet build --configuration Release --no-restore
